# Supabase 무료 요금제는 7일 동안 요청이 없으면 프로젝트를 자동 일시정지한다.
# 3일마다 keepalive 함수(supabase/migrations/202610210000_keepalive.sql)를 호출해서 깨어 있게 한다.
# ※ GitHub 예약 작업은 기본 브랜치(master)에 이 파일이 있어야 동작한다.
name: Supabase keepalive

on:
  schedule:
    - cron: "0 0 */3 * *"   # 3일마다 09:00 (한국 시각)
  workflow_dispatch:         # Actions 탭에서 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keepalive RPC
        env:
          # 앱에도 들어가는 공개용(publishable) 키라 노출돼도 괜찮다. secret 키는 절대 넣지 말 것.
          SUPABASE_URL: https://bsunxmbrbnqacbqvunbr.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_kvBHaFjsplNNbOsNR8cC_w_CdWJfEui
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $status: $(cat response.txt)"
          test "$status" = "200"
